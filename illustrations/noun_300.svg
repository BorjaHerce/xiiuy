<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_noun_300" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6F4E6"/>
      <stop offset="100%" stop-color="#B3E6BA"/>
    </linearGradient>
    <filter id="cardShadow_noun_300" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Card Base -->
  <rect x="8" y="8" width="224" height="224" rx="28" fill="url(#bgGrad_noun_300)" stroke="#1B5E20" stroke-width="2.5" filter="url(#cardShadow_noun_300)"/>

  <!-- Top Category Tag Pill -->
  <g transform="translate(16, 16)">
    <rect x="0" y="0" width="120" height="20" rx="10" fill="#C8E6C9" stroke="#1B5E20" stroke-width="1.2"/>
    <text x="60" y="13.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" font-weight="800" fill="#1B5E20" text-anchor="middle" letter-spacing="0.3">PLANTAS Y NATURALEZA</text>
  </g>

  <!-- ID badge on top right -->
  <g transform="translate(162, 16)">
    <rect x="0" y="0" width="62" height="20" rx="10" fill="rgba(255,255,255,0.85)" stroke="#1B5E20" stroke-width="1.2"/>
    <text x="31" y="13.5" font-family="monospace" font-size="8.5" font-weight="700" fill="#37474F" text-anchor="middle">noun_300</text>
  </g>

  <!-- Procedural Decorative Aura Pattern -->
  <g opacity="0.16" fill="none" stroke="#2E7D32" stroke-width="1.8" stroke-linecap="round"><path d="M52,150 Q65,110 50,80"/><path d="M188,150 Q175,110 190,80"/></g>

  <!-- Central Distinct Cartoon Artwork -->
  <g id="illustration-art" transform="translate(-2, -2) rotate(-2 120 115)">
    <g><path d="M100,162 Q82,114 66,86 M110,162 Q98,106 94,68 M120,162 Q120,102 120,60 M130,162 Q142,106 146,68 M140,162 Q158,114 174,86" fill="none" stroke="#43A047" stroke-width="6" stroke-linecap="round"/><ellipse cx="120" cy="162" rx="42" ry="8" fill="#8D6E63" stroke="#4E342E" stroke-width="2.5"/></g>
  </g>

  <!-- Bottom Information Banner -->
  <g transform="translate(14, 180)">
    <rect x="0" y="0" width="212" height="46" rx="20" fill="rgba(255,255,255,0.96)" stroke="#1B5E20" stroke-width="1.5"/>
    <text x="106" y="17" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="800" fill="#212121" text-anchor="middle">grass</text>
    <text x="106" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" font-weight="600" fill="#546E7A" text-anchor="middle">zacate</text>
    <text x="106" y="41" font-family="monospace" font-size="8" font-weight="700" fill="#1B5E20" text-anchor="middle">[ chixxi ]</text>
  </g>
</svg>
