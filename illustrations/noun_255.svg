    <g><path d="M116,105 C72,58 52,102 114,122 Z" fill="#FF7043" stroke="#BF360C" stroke-width="3"/><path d="M124,105 C168,58 188,102 126,122 Z" fill="#FF7043" stroke="#BF360C" stroke-width="3"/><path d="M116,122 C78,126 68,158 116,142 Z" fill="#FFA726" stroke="#E65100" stroke-width="2.5"/><path d="M124,122 C162,126 172,158 124,142 Z" fill="#FFA726" stroke="#E65100" stroke-width="2.5"/><circle cx="92" cy="96" r="6" fill="#FFF9C4"/><circle cx="148" cy="96" r="6" fill="#FFF9C4"/><ellipse cx="120" cy="120" rx="5" ry="28" fill="#3E2723"/><path d="M118,92 Q108,70 95,65 M122,92 Q132,70 145,65" fill="none" stroke="#3E2723" stroke-width="2.2" stroke-linecap="round"/></g>
