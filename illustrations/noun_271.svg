      <stop offset="0%" stop-color="#EAF3F5"/>
      <stop offset="100%" stop-color="#C4D9E9"/>
    </linearGradient>
    <filter id="cardShadow_noun_271" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Card Base -->
