    <g><g transform="rotate(-35 120 115)"><rect x="115" y="102" width="10" height="66" rx="5" fill="#B0BEC5" stroke="#37474F" stroke-width="2.5"/><ellipse cx="120" cy="82" rx="18" ry="26" fill="#ECEFF1" stroke="#37474F" stroke-width="3"/><ellipse cx="115" cy="78" rx="6" ry="14" fill="#FFFFFF"/></g></g>
  </g>

