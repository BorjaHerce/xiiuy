<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_noun_023" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2EAF5"/>
      <stop offset="100%" stop-color="#D2C0E7"/>
    </linearGradient>
    <filter id="cardShadow_noun_023" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Card Base -->
  <rect x="8" y="8" width="224" height="224" rx="28" fill="url(#bgGrad_noun_023)" stroke="#4A148C" stroke-width="2.5" filter="url(#cardShadow_noun_023)"/>

  <!-- Top Category Tag Pill -->
  <g transform="translate(16, 16)">
    <rect x="0" y="0" width="120" height="20" rx="10" fill="#E1BEE7" stroke="#4A148C" stroke-width="1.2"/>
    <text x="60" y="13.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" font-weight="800" fill="#4A148C" text-anchor="middle" letter-spacing="0.3">HOGAR Y ROPA</text>
  </g>

  <!-- ID badge on top right -->
  <g transform="translate(162, 16)">
    <rect x="0" y="0" width="62" height="20" rx="10" fill="rgba(255,255,255,0.85)" stroke="#4A148C" stroke-width="1.2"/>
    <text x="31" y="13.5" font-family="monospace" font-size="8.5" font-weight="700" fill="#37474F" text-anchor="middle">noun_023</text>
  </g>

  <!-- Procedural Decorative Aura Pattern -->
  <g opacity="0.14" stroke="#7B1FA2" stroke-width="1.5"><line x1="50" y1="55" x2="65" y2="70"/><line x1="60" y1="50" x2="75" y2="65"/><circle cx="120" cy="115" r="66" fill="none" stroke-dasharray="5,5"/></g>

  <!-- Central Distinct Cartoon Artwork -->
  <g id="illustration-art">
    <g id="mercado_art"><polygon points="56,105 78,72 162,72 184,105" fill="#E53935" stroke="#B71C1C" stroke-width="2.8"/><polygon points="88,105 98,72 142,72 152,105" fill="#FFFFFF" stroke="#B71C1C" stroke-width="2"/><rect x="68" y="132" width="104" height="36" rx="3" fill="#A1887F" stroke="#4E342E" stroke-width="2.8"/><line x1="72" y1="105" x2="72" y2="132" stroke="#5D4037" stroke-width="4"/><line x1="168" y1="105" x2="168" y2="132" stroke="#5D4037" stroke-width="4"/><circle cx="92" cy="124" r="9" fill="#FB8C00" stroke="#E65100" stroke-width="2"/><circle cx="120" cy="124" r="9" fill="#43A047" stroke="#1B5E20" stroke-width="2"/><circle cx="148" cy="124" r="9" fill="#FDD835" stroke="#F57F17" stroke-width="2"/></g>
  </g>

  <!-- Bottom Information Banner -->
  <g transform="translate(14, 180)">
