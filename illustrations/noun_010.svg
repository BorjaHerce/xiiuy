<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_noun_010" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7EBE8"/>
      <stop offset="100%" stop-color="#EDC9B6"/>
    </linearGradient>
    <filter id="cardShadow_noun_010" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Card Base -->
  <rect x="8" y="8" width="224" height="224" rx="28" fill="url(#bgGrad_noun_010)" stroke="#BF360C" stroke-width="2.5" filter="url(#cardShadow_noun_010)"/>

  <!-- Top Category Tag Pill -->
  <g transform="translate(16, 16)">
    <rect x="0" y="0" width="120" height="20" rx="10" fill="#FFCCBC" stroke="#BF360C" stroke-width="1.2"/>
    <text x="60" y="13.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" font-weight="800" fill="#BF360C" text-anchor="middle" letter-spacing="0.3">PERSONAS, PARENTESCO Y SOCIEDAD</text>
  </g>

  <!-- ID badge on top right -->
  <g transform="translate(162, 16)">
    <rect x="0" y="0" width="62" height="20" rx="10" fill="rgba(255,255,255,0.85)" stroke="#BF360C" stroke-width="1.2"/>
    <text x="31" y="13.5" font-family="monospace" font-size="8.5" font-weight="700" fill="#37474F" text-anchor="middle">noun_010</text>
  </g>

  <!-- Procedural Decorative Aura Pattern -->
  <g opacity="0.20" fill="#D84315"><circle cx="62" cy="72" r="5"/><circle cx="180" cy="65" r="7"/><circle cx="55" cy="155" r="4"/><circle cx="185" cy="148" r="6"/></g>

  <!-- Central Distinct Cartoon Artwork -->
  <g id="illustration-art">
    <g id="cantante_art"><circle cx="118" cy="80" r="23" fill="#FFE0B2" stroke="#4A148C" stroke-width="3"/><path d="M95,75 C97,52 139,52 141,75 C130,68 106,68 95,75 Z" fill="#3E2723"/><circle cx="110" cy="78" r="2.5" fill="#3E2723"/><circle cx="126" cy="78" r="2.5" fill="#3E2723"/><ellipse cx="118" cy="90" rx="6" ry="5" fill="#D32F2F" stroke="#B71C1C" stroke-width="1.5"/><path d="M90,168 C90,108 146,108 146,168 Z" fill="#AB47BC" stroke="#4A148C" stroke-width="3"/><line x1="156" y1="108" x2="156" y2="168" stroke="#546E7A" stroke-width="4" stroke-linecap="round"/><rect x="149" y="90" width="14" height="20" rx="7" fill="#CFD8DC" stroke="#263238" stroke-width="2.5"/><text x="72" y="72" font-size="22" font-weight="bold" fill="#8E24AA">&#9834;</text><text x="64" y="108" font-size="26" font-weight="bold" fill="#6A1B9A">&#9835;</text></g>
  </g>

  <!-- Bottom Information Banner -->
  <g transform="translate(14, 180)">
