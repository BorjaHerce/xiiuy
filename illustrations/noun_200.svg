    <text x="60" y="13.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" font-weight="800" fill="#880E4F" text-anchor="middle" letter-spacing="0.3">PARTES DEL CUERPO</text>
  </g>

  <!-- ID badge on top right -->
