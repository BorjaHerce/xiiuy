  <g id="illustration-art">
    <g id="esqueleto_skeleton"><circle cx="120" cy="68" r="18" fill="#FFFFFF" stroke="#263238" stroke-width="2.8"/><circle cx="113" cy="66" r="4" fill="#263238"/><circle cx="127" cy="66" r="4" fill="#263238"/><rect x="113" y="82" width="14" height="8" fill="#FFFFFF" stroke="#263238" stroke-width="2"/><line x1="120" y1="90" x2="120" y2="148" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/><line x1="120" y1="90" x2="120" y2="148" stroke="#263238" stroke-width="2" stroke-dasharray="3,3"/><path d="M96,102 Q120,108 144,102 M98,114 Q120,120 142,114 M102,126 Q120,132 138,126" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/><path d="M96,102 Q120,108 144,102 M98,114 Q120,120 142,114 M102,126 Q120,132 138,126" fill="none" stroke="#263238" stroke-width="2" stroke-linecap="round"/><ellipse cx="120" cy="148" rx="18" ry="8" fill="#FFFFFF" stroke="#263238" stroke-width="2.8"/><line x1="94" y1="100" x2="78" y2="134" stroke="#263238" stroke-width="4" stroke-linecap="round"/><line x1="146" y1="100" x2="162" y2="134" stroke="#263238" stroke-width="4" stroke-linecap="round"/><line x1="108" y1="154" x2="104" y2="170" stroke="#263238" stroke-width="4" stroke-linecap="round"/><line x1="132" y1="154" x2="136" y2="170" stroke="#263238" stroke-width="4" stroke-linecap="round"/></g>
