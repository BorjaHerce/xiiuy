    <g id="noun_435_art" transform="translate(-2,-2) rotate(1.8 120 115)"><rect x="68" y="122" width="92" height="24" rx="8" fill="#8D6E63" stroke="#4E342E" stroke-width="3"/><ellipse cx="160" cy="134" rx="8" ry="12" fill="#FFE0B2" stroke="#4E342E" stroke-width="2.5"/><rect x="76" y="96" width="88" height="24" rx="8" transform="rotate(-8 120 108)" fill="#6D4C41" stroke="#3E2723" stroke-width="3"/><ellipse cx="162" cy="102" rx="7" ry="12" fill="#FFCC80" stroke="#3E2723" stroke-width="2.5"/></g>
  </g>

  <!-- Bottom Information Banner -->
