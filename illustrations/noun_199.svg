<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_noun_199" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F3E7"/>
      <stop offset="100%" stop-color="#EDE3AB"/>
    </linearGradient>
    <filter id="cardShadow_noun_199" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Card Base -->
  <rect x="8" y="8" width="224" height="224" rx="28" fill="url(#bgGrad_noun_199)" stroke="#E65100" stroke-width="2.5" filter="url(#cardShadow_noun_199)"/>

  <!-- Top Category Tag Pill -->
  <g transform="translate(16, 16)">
    <rect x="0" y="0" width="120" height="20" rx="10" fill="#FFE082" stroke="#E65100" stroke-width="1.2"/>
    <text x="60" y="13.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" font-weight="800" fill="#E65100" text-anchor="middle" letter-spacing="0.3">COMIDA Y BEBIDA</text>
  </g>

  <!-- ID badge on top right -->
  <g transform="translate(162, 16)">
    <rect x="0" y="0" width="62" height="20" rx="10" fill="rgba(255,255,255,0.85)" stroke="#E65100" stroke-width="1.2"/>
    <text x="31" y="13.5" font-family="monospace" font-size="8.5" font-weight="700" fill="#37474F" text-anchor="middle">noun_199</text>
  </g>

  <!-- Procedural Decorative Aura Pattern -->
  <g opacity="0.14" stroke="#EF6C00" stroke-width="1.5"><line x1="50" y1="55" x2="65" y2="70"/><line x1="60" y1="50" x2="75" y2="65"/><circle cx="120" cy="115" r="66" fill="none" stroke-dasharray="5,5"/></g>

  <!-- Central Distinct Cartoon Artwork -->
  <g id="illustration-art">
    <g id="camote_sweetpotato"><path d="M62,134 C54,112 88,82 132,80 C168,78 184,96 172,116 C158,138 118,148 84,146 C70,146 66,142 62,134 Z" fill="#AD1457" stroke="#4A0025" stroke-width="3"/><path d="M62,134 L48,140 M172,96 L184,90" stroke="#6D4C41" stroke-width="2.5" stroke-linecap="round"/><circle cx="148" cy="138" r="22" fill="#880E4F" stroke="#4A0025" stroke-width="2.8"/><circle cx="148" cy="138" r="17" fill="#FFA726"/><circle cx="148" cy="138" r="10" fill="#FFCC80"/></g>
  </g>

  <!-- Bottom Information Banner -->
  <g transform="translate(14, 180)">
    <rect x="0" y="0" width="212" height="46" rx="20" fill="rgba(255,255,255,0.96)" stroke="#E65100" stroke-width="1.5"/>
    <text x="106" y="17" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="800" fill="#212121" text-anchor="middle">sweet potato</text>
    <text x="106" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" font-weight="600" fill="#546E7A" text-anchor="middle">camote (sweet potato)</text>
    <text x="106" y="41" font-family="monospace" font-size="8" font-weight="700" fill="#E65100" text-anchor="middle">[ ping&apos;u ]</text>
