    <g><circle cx="120" cy="116" r="44" fill="#AB47BC" stroke="#4A148C" stroke-width="3.5"/><circle cx="120" cy="116" r="34" fill="#CE93D8" stroke="#4A148C" stroke-width="2.5"/><circle cx="108" cy="104" r="6" fill="#4A148C"/><circle cx="132" cy="104" r="6" fill="#4A148C"/><circle cx="108" cy="128" r="6" fill="#4A148C"/><circle cx="132" cy="128" r="6" fill="#4A148C"/><line x1="108" y1="104" x2="132" y2="128" stroke="#FFF9C4" stroke-width="3" stroke-linecap="round"/><line x1="132" y1="104" x2="108" y2="128" stroke="#FFF9C4" stroke-width="3" stroke-linecap="round"/></g>
