  <g id="illustration-art">
    <g id="doctor_art"><ellipse cx="120" cy="82" rx="24" ry="22" fill="#FFE0B2" stroke="#37474F" stroke-width="3"/><path d="M96,75 C96,55 144,55 144,75 C135,68 105,68 96,75 Z" fill="#37474F"/><circle cx="111" cy="82" r="3" fill="#263238"/><circle cx="129" cy="82" r="3" fill="#263238"/><path d="M115,92 Q120,98 125,92" stroke="#D84315" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M92,106 L80,172 L160,172 L148,106 Z" fill="#FFFFFF" stroke="#37474F" stroke-width="3"/><path d="M106,106 C106,136 134,136 134,106" fill="none" stroke="#546E7A" stroke-width="3.5" stroke-linecap="round"/><circle cx="120" cy="140" r="6" fill="#CFD8DC" stroke="#37474F" stroke-width="2"/><rect x="136" y="132" width="14" height="14" rx="2" fill="#E53935"/><line x1="143" y1="135" x2="143" y2="143" stroke="#FFFFFF" stroke-width="2.5"/><line x1="139" y1="139" x2="147" y2="139" stroke="#FFFFFF" stroke-width="2.5"/></g>
