      <stop offset="0%" stop-color="#F7EAE8"/>
      <stop offset="100%" stop-color="#EDCFB6"/>
    </linearGradient>
    <filter id="cardShadow_noun_003" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
