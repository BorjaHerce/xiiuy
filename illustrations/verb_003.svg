      <stop offset="0%" stop-color="#F3E5F5"/>
      <stop offset="100%" stop-color="#E1BEE7"/>
    </linearGradient>
    <filter id="cardShadow_verb_003" x="-8%" y="-8%" width="116%" height="116%">
