    <g id="noun_553_art" transform="translate(-1,1) rotate(-1.8 120 115)"><circle cx="120" cy="122" r="36" fill="#E53935" stroke="#B71C1C" stroke-width="3.5"/><polygon points="120,86 106,76 116,88 120,72 124,88 134,76" fill="#2E7D32" stroke="#1B5E20" stroke-width="2"/><ellipse cx="104" cy="110" rx="6" ry="12" transform="rotate(-25 104 110)" fill="#FF8A80"/></g>
  </g>

  <!-- Bottom Information Banner -->
  <g transform="translate(14, 180)">
    <rect x="0" y="0" width="212" height="46" rx="20" fill="rgba(255,255,255,0.96)" stroke="#E65100" stroke-width="1.5"/>
