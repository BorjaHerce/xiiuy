      <stop offset="0%" stop-color="#F8F0E7"/>
      <stop offset="100%" stop-color="#EDE1AB"/>
    </linearGradient>
    <filter id="cardShadow_noun_553" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Card Base -->
  <rect x="8" y="8" width="224" height="224" rx="28" fill="url(#bgGrad_noun_553)" stroke="#E65100" stroke-width="2.5" filter="url(#cardShadow_noun_553)"/>

  <!-- Top Category Tag Pill -->
  <g transform="translate(16, 16)">
    <rect x="0" y="0" width="120" height="20" rx="10" fill="#FFE082" stroke="#E65100" stroke-width="1.2"/>
    <text x="60" y="13.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" font-weight="800" fill="#E65100" text-anchor="middle" letter-spacing="0.3">COMIDA Y BEBIDA</text>
  </g>

  <!-- ID badge on top right -->
  <g transform="translate(162, 16)">
    <rect x="0" y="0" width="62" height="20" rx="10" fill="rgba(255,255,255,0.85)" stroke="#E65100" stroke-width="1.2"/>
    <text x="31" y="13.5" font-family="monospace" font-size="8.5" font-weight="700" fill="#37474F" text-anchor="middle">noun_553</text>
  </g>

  <!-- Procedural Decorative Aura Pattern -->
  <g opacity="0.14"><polygon points="120,50 182,115 120,180 58,115" fill="none" stroke="#EF6C00" stroke-width="2"/><polygon points="120,64 168,115 120,166 72,115" fill="none" stroke="#EF6C00" stroke-width="1.2" stroke-dasharray="4,4"/></g>

  <!-- Central Distinct Cartoon Artwork -->
