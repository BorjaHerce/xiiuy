<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_noun_121" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7EFE9"/>
      <stop offset="100%" stop-color="#EAC8B8"/>
    </linearGradient>
    <filter id="cardShadow_noun_121" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Card Base -->
  <rect x="8" y="8" width="224" height="224" rx="28" fill="url(#bgGrad_noun_121)" stroke="#4E342E" stroke-width="2.5" filter="url(#cardShadow_noun_121)"/>

  <!-- Top Category Tag Pill -->
  <g transform="translate(16, 16)">
    <rect x="0" y="0" width="120" height="20" rx="10" fill="#FFE0B2" stroke="#4E342E" stroke-width="1.2"/>
    <text x="60" y="13.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" font-weight="800" fill="#4E342E" text-anchor="middle" letter-spacing="0.3">ANIMALES</text>
  </g>

  <!-- ID badge on top right -->
  <g transform="translate(162, 16)">
    <rect x="0" y="0" width="62" height="20" rx="10" fill="rgba(255,255,255,0.85)" stroke="#4E342E" stroke-width="1.2"/>
    <text x="31" y="13.5" font-family="monospace" font-size="8.5" font-weight="700" fill="#37474F" text-anchor="middle">noun_121</text>
  </g>

  <!-- Procedural Decorative Aura Pattern -->
  <g opacity="0.14"><polygon points="120,50 182,115 120,180 58,115" fill="none" stroke="#D84315" stroke-width="2"/><polygon points="120,64 168,115 120,166 72,115" fill="none" stroke="#D84315" stroke-width="1.2" stroke-dasharray="4,4"/></g>

  <!-- Central Distinct Cartoon Artwork -->
  <g id="illustration-art">
    <g id="cardenal_bird"><line x1="62" y1="148" x2="178" y2="148" stroke="#6D4C41" stroke-width="6" stroke-linecap="round"/><path d="M92,148 L72,172 L86,172 L102,148" fill="#C62828" stroke="#8E0000" stroke-width="2.2"/><ellipse cx="120" cy="122" rx="28" ry="24" fill="#E53935" stroke="#8E0000" stroke-width="3"/><polygon points="104,98 118,62 136,92" fill="#E53935" stroke="#8E0000" stroke-width="2.8" stroke-linejoin="round"/><circle cx="124" cy="96" r="16" fill="#E53935" stroke="#8E0000" stroke-width="2.8"/><polygon points="128,88 140,94 128,104 120,96" fill="#212121"/><polygon points="140,90 156,96 140,102" fill="#FF8F00" stroke="#E65100" stroke-width="2"/><circle cx="130" cy="92" r="2.5" fill="#FFFFFF"/></g>
  </g>

  <!-- Bottom Information Banner -->
  <g transform="translate(14, 180)">
    <rect x="0" y="0" width="212" height="46" rx="20" fill="rgba(255,255,255,0.96)" stroke="#4E342E" stroke-width="1.5"/>
    <text x="106" y="17" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="800" fill="#212121" text-anchor="middle">cardinal</text>
    <text x="106" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" font-weight="600" fill="#546E7A" text-anchor="middle">cardenal, tipo de pajaro</text>
    <text x="106" y="41" font-family="monospace" font-size="8" font-weight="700" fill="#4E342E" text-anchor="middle">[ nabeu&apos; ]</text>
  </g>
</svg>
