<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_noun_191" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6F4E8"/>
      <stop offset="100%" stop-color="#BBE6B3"/>
    </linearGradient>
    <filter id="cardShadow_noun_191" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Card Base -->
  <rect x="8" y="8" width="224" height="224" rx="28" fill="url(#bgGrad_noun_191)" stroke="#1B5E20" stroke-width="2.5" filter="url(#cardShadow_noun_191)"/>

  <!-- Top Category Tag Pill -->
  <g transform="translate(16, 16)">
    <rect x="0" y="0" width="120" height="20" rx="10" fill="#C8E6C9" stroke="#1B5E20" stroke-width="1.2"/>
    <text x="60" y="13.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" font-weight="800" fill="#1B5E20" text-anchor="middle" letter-spacing="0.3">PLANTAS Y NATURALEZA</text>
  </g>

  <!-- ID badge on top right -->
  <g transform="translate(162, 16)">
    <rect x="0" y="0" width="62" height="20" rx="10" fill="rgba(255,255,255,0.85)" stroke="#1B5E20" stroke-width="1.2"/>
    <text x="31" y="13.5" font-family="monospace" font-size="8.5" font-weight="700" fill="#37474F" text-anchor="middle">noun_191</text>
  </g>

  <!-- Procedural Decorative Aura Pattern -->
  <g opacity="0.14" stroke="#2E7D32" stroke-width="1.5"><line x1="50" y1="55" x2="65" y2="70"/><line x1="60" y1="50" x2="75" y2="65"/><circle cx="120" cy="115" r="66" fill="none" stroke-dasharray="5,5"/></g>

  <!-- Central Distinct Cartoon Artwork -->
  <g id="illustration-art">
    <g id="marro_sledgehammer"><polygon points="62,158 78,136 102,148 96,164" fill="#90A4AE" stroke="#37474F" stroke-width="2.5"/><polygon points="108,162 118,144 134,158" fill="#B0BEC5" stroke="#37474F" stroke-width="2.5"/><line x1="78" y1="62" x2="152" y2="136" stroke="#8D6E63" stroke-width="10" stroke-linecap="round"/><g transform="rotate(-45 148 132)"><rect x="122" y="114" width="52" height="32" rx="4" fill="#546E7A" stroke="#263238" stroke-width="3"/></g></g>
  </g>

  <!-- Bottom Information Banner -->
  <g transform="translate(14, 180)">
    <rect x="0" y="0" width="212" height="46" rx="20" fill="rgba(255,255,255,0.96)" stroke="#1B5E20" stroke-width="1.5"/>
    <text x="106" y="17" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="800" fill="#212121" text-anchor="middle">sledgehammer</text>
    <text x="106" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" font-weight="600" fill="#546E7A" text-anchor="middle">azadón2, para romper la piedra (marro)</text>
    <text x="106" y="41" font-family="monospace" font-size="8" font-weight="700" fill="#1B5E20" text-anchor="middle">[ ngul&apos;ua ]</text>
  </g>
