<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_noun_400" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF1F5"/>
      <stop offset="100%" stop-color="#C4D9E9"/>
    </linearGradient>
    <filter id="cardShadow_noun_400" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Card Base -->
  <rect x="8" y="8" width="224" height="224" rx="28" fill="url(#bgGrad_noun_400)" stroke="#263238" stroke-width="2.5" filter="url(#cardShadow_noun_400)"/>

  <!-- Top Category Tag Pill -->
  <g transform="translate(16, 16)">
    <rect x="0" y="0" width="120" height="20" rx="10" fill="#CFD8DC" stroke="#263238" stroke-width="1.2"/>
    <text x="60" y="13.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" font-weight="800" fill="#263238" text-anchor="middle" letter-spacing="0.3">HERRAMIENTAS E INSTRUMENTOS</text>
  </g>

  <!-- ID badge on top right -->
  <g transform="translate(162, 16)">
    <rect x="0" y="0" width="62" height="20" rx="10" fill="rgba(255,255,255,0.85)" stroke="#263238" stroke-width="1.2"/>
    <text x="31" y="13.5" font-family="monospace" font-size="8.5" font-weight="700" fill="#37474F" text-anchor="middle">noun_400</text>
  </g>

  <!-- Procedural Decorative Aura Pattern -->
  <g opacity="0.16"><circle cx="120" cy="115" r="68" fill="none" stroke="#455A64" stroke-width="2" stroke-dasharray="4,6"/><line x1="120" y1="42" x2="120" y2="188" stroke="#455A64" stroke-width="1.5" stroke-dasharray="3,5"/><line x1="47" y1="115" x2="193" y2="115" stroke="#455A64" stroke-width="1.5" stroke-dasharray="3,5"/></g>

  <!-- Central Distinct Cartoon Artwork -->
  <g id="illustration-art" transform="translate(-2, -2) rotate(-2 120 115)">
    <g><rect x="72" y="92" width="96" height="70" rx="6" fill="#CFD8DC" stroke="#37474F" stroke-width="3"/><rect x="84" y="118" width="72" height="34" rx="3" fill="#455A64" stroke="#263238" stroke-width="2"/><rect x="82" y="70" width="32" height="22" rx="3" fill="#E53935" stroke="#880E4F" stroke-width="2.5"/><rect x="124" y="76" width="32" height="16" rx="3" fill="#1E88E5" stroke="#0D47A1" stroke-width="2.5"/><circle cx="96" cy="104" r="4" fill="#263238"/><circle cx="120" cy="104" r="4" fill="#263238"/><circle cx="144" cy="104" r="4" fill="#263238"/></g>
  </g>

  <!-- Bottom Information Banner -->
  <g transform="translate(14, 180)">
    <rect x="0" y="0" width="212" height="46" rx="20" fill="rgba(255,255,255,0.96)" stroke="#263238" stroke-width="1.5"/>
    <text x="106" y="17" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="800" fill="#212121" text-anchor="middle">stove</text>
    <text x="106" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" font-weight="600" fill="#546E7A" text-anchor="middle">estufa/bateria</text>
    <text x="106" y="41" font-family="monospace" font-size="8" font-weight="700" fill="#263238" text-anchor="middle">[ ngul&apos;ang ]</text>
