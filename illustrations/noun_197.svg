<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_noun_197" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6F4EA"/>
      <stop offset="100%" stop-color="#B3E6C0"/>
    </linearGradient>
    <filter id="cardShadow_noun_197" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Card Base -->
  <rect x="8" y="8" width="224" height="224" rx="28" fill="url(#bgGrad_noun_197)" stroke="#1B5E20" stroke-width="2.5" filter="url(#cardShadow_noun_197)"/>

  <!-- Top Category Tag Pill -->
  <g transform="translate(16, 16)">
    <rect x="0" y="0" width="120" height="20" rx="10" fill="#C8E6C9" stroke="#1B5E20" stroke-width="1.2"/>
    <text x="60" y="13.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" font-weight="800" fill="#1B5E20" text-anchor="middle" letter-spacing="0.3">PLANTAS Y NATURALEZA</text>
  </g>

  <!-- ID badge on top right -->
  <g transform="translate(162, 16)">
    <rect x="0" y="0" width="62" height="20" rx="10" fill="rgba(255,255,255,0.85)" stroke="#1B5E20" stroke-width="1.2"/>
    <text x="31" y="13.5" font-family="monospace" font-size="8.5" font-weight="700" fill="#37474F" text-anchor="middle">noun_197</text>
  </g>

  <!-- Procedural Decorative Aura Pattern -->
  <g opacity="0.15" fill="none" stroke="#2E7D32" stroke-width="2" stroke-linecap="round"><path d="M50,75 C80,60 160,85 190,70"/><path d="M45,155 C75,140 165,165 195,150"/></g>

  <!-- Central Distinct Cartoon Artwork -->
  <g id="illustration-art">
    <g id="obsidiana_stone"><polygon points="120,50 156,88 148,144 120,164 92,144 84,88" fill="#263238" stroke="#000000" stroke-width="3" stroke-linejoin="round"/><polygon points="120,50 156,88 128,112 120,50" fill="#455A64"/><polygon points="84,88 128,112 92,144" fill="#37474F"/><polyline points="120,50 128,112 120,164 M84,88 128,112 156,88" fill="none" stroke="#90A4AE" stroke-width="2"/><line x1="100" y1="78" x2="112" y2="64" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/></g>
  </g>

  <!-- Bottom Information Banner -->
  <g transform="translate(14, 180)">
    <rect x="0" y="0" width="212" height="46" rx="20" fill="rgba(255,255,255,0.96)" stroke="#1B5E20" stroke-width="1.5"/>
    <text x="106" y="17" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="800" fill="#212121" text-anchor="middle">obsidian</text>
    <text x="106" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" font-weight="600" fill="#546E7A" text-anchor="middle">obsidiana</text>
    <text x="106" y="41" font-family="monospace" font-size="8" font-weight="700" fill="#1B5E20" text-anchor="middle">[ pikyua ]</text>
  </g>
</svg>
