  </g>

  <!-- Bottom Information Banner -->
  <g transform="translate(14, 180)">
    <rect x="0" y="0" width="212" height="46" rx="20" fill="rgba(255,255,255,0.96)" stroke="#F57F17" stroke-width="1.5"/>
    <text x="106" y="17" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="800" fill="#212121" text-anchor="middle">cold</text>
