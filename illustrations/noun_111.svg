<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_noun_111" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7F4E6"/>
      <stop offset="100%" stop-color="#B3E6B8"/>
    </linearGradient>
    <filter id="cardShadow_noun_111" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Card Base -->
  <rect x="8" y="8" width="224" height="224" rx="28" fill="url(#bgGrad_noun_111)" stroke="#1B5E20" stroke-width="2.5" filter="url(#cardShadow_noun_111)"/>

  <!-- Top Category Tag Pill -->
  <g transform="translate(16, 16)">
    <rect x="0" y="0" width="120" height="20" rx="10" fill="#C8E6C9" stroke="#1B5E20" stroke-width="1.2"/>
    <text x="60" y="13.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" font-weight="800" fill="#1B5E20" text-anchor="middle" letter-spacing="0.3">PLANTAS Y NATURALEZA</text>
  </g>

  <!-- ID badge on top right -->
  <g transform="translate(162, 16)">
    <rect x="0" y="0" width="62" height="20" rx="10" fill="rgba(255,255,255,0.85)" stroke="#1B5E20" stroke-width="1.2"/>
    <text x="31" y="13.5" font-family="monospace" font-size="8.5" font-weight="700" fill="#37474F" text-anchor="middle">noun_111</text>
  </g>

  <!-- Procedural Decorative Aura Pattern -->
  <g opacity="0.14" stroke="#2E7D32" stroke-width="1.5"><line x1="50" y1="55" x2="65" y2="70"/><line x1="60" y1="50" x2="75" y2="65"/><circle cx="120" cy="115" r="66" fill="none" stroke-dasharray="5,5"/></g>

  <!-- Central Distinct Cartoon Artwork -->
  <g id="illustration-art">
    <g id="frutito_verde_plant"><path d="M88,164 C88,110 112,72 156,64" fill="none" stroke="#2E7D32" stroke-width="5" stroke-linecap="round"/><ellipse cx="82" cy="102" rx="16" ry="8" transform="rotate(-30 82 102)" fill="#66BB6A" stroke="#1B5E20" stroke-width="2.2"/><ellipse cx="106" cy="76" rx="16" ry="8" transform="rotate(-20 106 76)" fill="#66BB6A" stroke="#1B5E20" stroke-width="2.2"/><rect x="116" y="88" width="12" height="42" rx="6" fill="#7CB342" stroke="#33691E" stroke-width="2.5"/><rect x="142" y="76" width="12" height="44" rx="6" fill="#8BC34A" stroke="#33691E" stroke-width="2.5"/></g>
  </g>

  <!-- Bottom Information Banner -->
  <g transform="translate(14, 180)">
    <rect x="0" y="0" width="212" height="46" rx="20" fill="rgba(255,255,255,0.96)" stroke="#1B5E20" stroke-width="1.5"/>
    <text x="106" y="17" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="800" fill="#212121" text-anchor="middle">plant</text>
    <text x="106" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" font-weight="600" fill="#546E7A" text-anchor="middle">(planta con) frutito largo verde</text>
    <text x="106" y="41" font-family="monospace" font-size="8" font-weight="700" fill="#1B5E20" text-anchor="middle">[ namba&apos;a ]</text>
  </g>
</svg>
