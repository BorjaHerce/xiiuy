<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_noun_420" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3EAF5"/>
      <stop offset="100%" stop-color="#DFC0E7"/>
    </linearGradient>
    <filter id="cardShadow_noun_420" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Card Base -->
  <rect x="8" y="8" width="224" height="224" rx="28" fill="url(#bgGrad_noun_420)" stroke="#4A148C" stroke-width="2.5" filter="url(#cardShadow_noun_420)"/>

  <!-- Top Category Tag Pill -->
  <g transform="translate(16, 16)">
    <rect x="0" y="0" width="120" height="20" rx="10" fill="#E1BEE7" stroke="#4A148C" stroke-width="1.2"/>
    <text x="60" y="13.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" font-weight="800" fill="#4A148C" text-anchor="middle" letter-spacing="0.3">HOGAR Y ROPA</text>
  </g>

  <!-- ID badge on top right -->
  <g transform="translate(162, 16)">
    <rect x="0" y="0" width="62" height="20" rx="10" fill="rgba(255,255,255,0.85)" stroke="#4A148C" stroke-width="1.2"/>
    <text x="31" y="13.5" font-family="monospace" font-size="8.5" font-weight="700" fill="#37474F" text-anchor="middle">noun_420</text>
  </g>

  <!-- Procedural Decorative Aura Pattern -->
  <g opacity="0.16" fill="none" stroke="#7B1FA2" stroke-width="1.8" stroke-linecap="round"><path d="M52,150 Q65,110 50,80"/><path d="M188,150 Q175,110 190,80"/></g>

  <!-- Central Distinct Cartoon Artwork -->
  <g id="illustration-art">
    <g id="noun_420_art" transform="translate(-2,-2) rotate(-1.8 120 115)"><polygon points="120,64 176,120 120,164 64,120" fill="#EF5350" stroke="#B71C1C" stroke-width="3"/><polygon points="120,76 162,120 120,152 78,120" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4,4"/><circle cx="120" cy="116" r="6" fill="#FFFFFF"/><circle cx="104" cy="120" r="3" fill="#FFFFFF"/><circle cx="136" cy="120" r="3" fill="#FFFFFF"/></g>
  </g>

  <!-- Bottom Information Banner -->
  <g transform="translate(14, 180)">
    <rect x="0" y="0" width="212" height="46" rx="20" fill="rgba(255,255,255,0.96)" stroke="#4A148C" stroke-width="1.5"/>
