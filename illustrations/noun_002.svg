<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_noun_002" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0EAF5"/>
      <stop offset="100%" stop-color="#E0C0E7"/>
    </linearGradient>
    <filter id="cardShadow_noun_002" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Card Base -->
  <rect x="8" y="8" width="224" height="224" rx="28" fill="url(#bgGrad_noun_002)" stroke="#4A148C" stroke-width="2.5" filter="url(#cardShadow_noun_002)"/>

  <!-- Top Category Tag Pill -->
  <g transform="translate(16, 16)">
    <rect x="0" y="0" width="120" height="20" rx="10" fill="#E1BEE7" stroke="#4A148C" stroke-width="1.2"/>
    <text x="60" y="13.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" font-weight="800" fill="#4A148C" text-anchor="middle" letter-spacing="0.3">HOGAR Y ROPA</text>
  </g>

  <!-- ID badge on top right -->
  <g transform="translate(162, 16)">
    <rect x="0" y="0" width="62" height="20" rx="10" fill="rgba(255,255,255,0.85)" stroke="#4A148C" stroke-width="1.2"/>
    <text x="31" y="13.5" font-family="monospace" font-size="8.5" font-weight="700" fill="#37474F" text-anchor="middle">noun_002</text>
  </g>

  <!-- Procedural Decorative Aura Pattern -->
  <g opacity="0.20" fill="#7B1FA2"><circle cx="62" cy="72" r="5"/><circle cx="180" cy="65" r="7"/><circle cx="55" cy="155" r="4"/><circle cx="185" cy="148" r="6"/></g>

  <!-- Central Distinct Cartoon Artwork -->
  <g id="illustration-art">
    <g id="tela_cloth"><path d="M72,110 L138,82 L168,98 L102,126 Z" fill="#42A5F5" stroke="#1565C0" stroke-width="2.5"/><path d="M72,110 L102,126 L102,154 L72,138 Z" fill="#1E88E5" stroke="#1565C0" stroke-width="2.5"/><path d="M102,126 L168,98 L168,126 L102,154 Z" fill="#64B5F6" stroke="#1565C0" stroke-width="2.5"/><line x1="82" y1="120" x2="148" y2="92" stroke="#FFD54F" stroke-width="3"/><line x1="92" y1="124" x2="158" y2="96" stroke="#E53935" stroke-width="3"/><ellipse cx="168" cy="112" rx="8" ry="14" fill="#BBDEFB" stroke="#1565C0" stroke-width="2"/></g>
  </g>

  <!-- Bottom Information Banner -->
  <g transform="translate(14, 180)">
    <rect x="0" y="0" width="212" height="46" rx="20" fill="rgba(255,255,255,0.96)" stroke="#4A148C" stroke-width="1.5"/>
    <text x="106" y="17" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="800" fill="#212121" text-anchor="middle">cloth</text>
    <text x="106" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" font-weight="600" fill="#546E7A" text-anchor="middle">tela</text>
    <text x="106" y="41" font-family="monospace" font-size="8" font-weight="700" fill="#4A148C" text-anchor="middle">[ xut ]</text>
