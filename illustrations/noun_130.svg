<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_noun_130" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9EFF7"/>
      <stop offset="100%" stop-color="#BCBDEB"/>
    </linearGradient>
    <filter id="cardShadow_noun_130" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Card Base -->
  <rect x="8" y="8" width="224" height="224" rx="28" fill="url(#bgGrad_noun_130)" stroke="#1A237E" stroke-width="2.5" filter="url(#cardShadow_noun_130)"/>

  <!-- Top Category Tag Pill -->
  <g transform="translate(16, 16)">
    <rect x="0" y="0" width="120" height="20" rx="10" fill="#C5CAE9" stroke="#1A237E" stroke-width="1.2"/>
    <text x="60" y="13.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" font-weight="800" fill="#1A237E" text-anchor="middle" letter-spacing="0.3">ACCIONES Y VERBOS</text>
  </g>

  <!-- ID badge on top right -->
  <g transform="translate(162, 16)">
    <rect x="0" y="0" width="62" height="20" rx="10" fill="rgba(255,255,255,0.85)" stroke="#1A237E" stroke-width="1.2"/>
    <text x="31" y="13.5" font-family="monospace" font-size="8.5" font-weight="700" fill="#37474F" text-anchor="middle">noun_130</text>
  </g>

  <!-- Procedural Decorative Aura Pattern -->
  <g opacity="0.20" fill="#303F9F"><circle cx="62" cy="72" r="5"/><circle cx="180" cy="65" r="7"/><circle cx="55" cy="155" r="4"/><circle cx="185" cy="148" r="6"/></g>

  <!-- Central Distinct Cartoon Artwork -->
  <g id="illustration-art">
    <g id="multa_ticket"><rect x="76" y="54" width="88" height="112" rx="6" fill="#FFF8E1" stroke="#E65100" stroke-width="3"/><rect x="88" y="66" width="64" height="18" rx="3" fill="#E53935"/><text x="120" y="79" font-family="sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">MULTA</text><line x1="90" y1="100" x2="150" y2="100" stroke="#78909C" stroke-width="3" stroke-linecap="round"/><line x1="90" y1="114" x2="136" y2="114" stroke="#78909C" stroke-width="3" stroke-linecap="round"/><circle cx="136" cy="140" r="14" fill="#FFD54F" stroke="#F57F17" stroke-width="2.5"/><text x="136" y="145" font-size="15" font-weight="bold" fill="#E65100" text-anchor="middle">$</text></g>
  </g>

  <!-- Bottom Information Banner -->
  <g transform="translate(14, 180)">
    <rect x="0" y="0" width="212" height="46" rx="20" fill="rgba(255,255,255,0.96)" stroke="#1A237E" stroke-width="1.5"/>
    <text x="106" y="17" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="800" fill="#212121" text-anchor="middle">punishment</text>
    <text x="106" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" font-weight="600" fill="#546E7A" text-anchor="middle">multa</text>
    <text x="106" y="41" font-family="monospace" font-size="8" font-weight="700" fill="#1A237E" text-anchor="middle">[ natsja&apos; ]</text>
  </g>
