<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_noun_059" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF2F5"/>
      <stop offset="100%" stop-color="#C4E0E9"/>
    </linearGradient>
    <filter id="cardShadow_noun_059" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Card Base -->
  <rect x="8" y="8" width="224" height="224" rx="28" fill="url(#bgGrad_noun_059)" stroke="#263238" stroke-width="2.5" filter="url(#cardShadow_noun_059)"/>

  <!-- Top Category Tag Pill -->
  <g transform="translate(16, 16)">
    <rect x="0" y="0" width="120" height="20" rx="10" fill="#CFD8DC" stroke="#263238" stroke-width="1.2"/>
    <text x="60" y="13.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" font-weight="800" fill="#263238" text-anchor="middle" letter-spacing="0.3">HERRAMIENTAS E INSTRUMENTOS</text>
  </g>

  <!-- ID badge on top right -->
  <g transform="translate(162, 16)">
    <rect x="0" y="0" width="62" height="20" rx="10" fill="rgba(255,255,255,0.85)" stroke="#263238" stroke-width="1.2"/>
    <text x="31" y="13.5" font-family="monospace" font-size="8.5" font-weight="700" fill="#37474F" text-anchor="middle">noun_059</text>
  </g>

  <!-- Procedural Decorative Aura Pattern -->
  <g opacity="0.15" stroke="#455A64" fill="none"><circle cx="120" cy="115" r="72" stroke-width="1.5"/><circle cx="120" cy="115" r="52" stroke-width="1.2" stroke-dasharray="5,4"/></g>

  <!-- Central Distinct Cartoon Artwork -->
  <g id="illustration-art">
    <g id="pala_shovel"><path d="M62,166 C74,140 132,140 144,166 Z" fill="#6D4C41" stroke="#3E2723" stroke-width="3"/><line x1="114" y1="128" x2="148" y2="58" stroke="#8D6E63" stroke-width="8" stroke-linecap="round"/><path d="M140,48 L160,58 L154,68 L134,58 Z" fill="none" stroke="#5D4037" stroke-width="5" stroke-linejoin="round"/><path d="M96,120 L132,136 L116,164 C104,168 90,162 84,148 Z" fill="#90A4AE" stroke="#263238" stroke-width="3" stroke-linejoin="round"/></g>
  </g>

  <!-- Bottom Information Banner -->
  <g transform="translate(14, 180)">
    <rect x="0" y="0" width="212" height="46" rx="20" fill="rgba(255,255,255,0.96)" stroke="#263238" stroke-width="1.5"/>
    <text x="106" y="17" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="800" fill="#212121" text-anchor="middle">shovel</text>
    <text x="106" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" font-weight="600" fill="#546E7A" text-anchor="middle">pala</text>
    <text x="106" y="41" font-family="monospace" font-size="8" font-weight="700" fill="#263238" text-anchor="middle">[ lapal ]</text>
