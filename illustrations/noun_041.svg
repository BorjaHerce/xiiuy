      <stop offset="0%" stop-color="#F7F2E9"/>
      <stop offset="100%" stop-color="#EAD5B8"/>
    </linearGradient>
    <filter id="cardShadow_noun_041" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Card Base -->
  <rect x="8" y="8" width="224" height="224" rx="28" fill="url(#bgGrad_noun_041)" stroke="#4E342E" stroke-width="2.5" filter="url(#cardShadow_noun_041)"/>

