<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_noun_049" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F7E9"/>
      <stop offset="100%" stop-color="#EAE5B8"/>
    </linearGradient>
    <filter id="cardShadow_noun_049" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Card Base -->
  <rect x="8" y="8" width="224" height="224" rx="28" fill="url(#bgGrad_noun_049)" stroke="#F57F17" stroke-width="2.5" filter="url(#cardShadow_noun_049)"/>

  <!-- Top Category Tag Pill -->
  <g transform="translate(16, 16)">
    <rect x="0" y="0" width="120" height="20" rx="10" fill="#FFF9C4" stroke="#F57F17" stroke-width="1.2"/>
    <text x="60" y="13.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" font-weight="800" fill="#F57F17" text-anchor="middle" letter-spacing="0.3">CUALIDADES Y ESTADOS</text>
  </g>

  <!-- ID badge on top right -->
  <g transform="translate(162, 16)">
    <rect x="0" y="0" width="62" height="20" rx="10" fill="rgba(255,255,255,0.85)" stroke="#F57F17" stroke-width="1.2"/>
    <text x="31" y="13.5" font-family="monospace" font-size="8.5" font-weight="700" fill="#37474F" text-anchor="middle">noun_049</text>
  </g>

  <!-- Procedural Decorative Aura Pattern -->
  <g opacity="0.14"><polygon points="120,50 182,115 120,180 58,115" fill="none" stroke="#F57F17" stroke-width="2"/><polygon points="120,64 168,115 120,166 72,115" fill="none" stroke="#F57F17" stroke-width="1.2" stroke-dasharray="4,4"/></g>

  <!-- Central Distinct Cartoon Artwork -->
  <g id="illustration-art">
    <g id="sitio_tibio"><path d="M62,148 A58,50 0 0,1 178,148 Z" fill="#FFB74D" stroke="#E65100" stroke-width="3"/><path d="M88,92 C82,78 94,68 88,54 M120,86 C114,72 126,62 120,48 M152,92 C146,78 158,68 152,54" fill="none" stroke="#FFA726" stroke-width="3.5" stroke-linecap="round"/></g>
  </g>

  <!-- Bottom Information Banner -->
  <g transform="translate(14, 180)">
    <rect x="0" y="0" width="212" height="46" rx="20" fill="rgba(255,255,255,0.96)" stroke="#F57F17" stroke-width="1.5"/>
    <text x="106" y="17" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="800" fill="#212121" text-anchor="middle">warmth</text>
    <text x="106" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" font-weight="600" fill="#546E7A" text-anchor="middle">sitio tibio (calentito)</text>
    <text x="106" y="41" font-family="monospace" font-size="8" font-weight="700" fill="#F57F17" text-anchor="middle">[ kupats&apos; ]</text>
