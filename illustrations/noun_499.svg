      <stop offset="0%" stop-color="#F8F4E7"/>
      <stop offset="100%" stop-color="#EDD6AB"/>
    </linearGradient>
    <filter id="cardShadow_noun_499" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
