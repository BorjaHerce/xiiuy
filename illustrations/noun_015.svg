      <stop offset="0%" stop-color="#F7EFE8"/>
      <stop offset="100%" stop-color="#EDC4B6"/>
    </linearGradient>
    <filter id="cardShadow_noun_015" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Card Base -->
  <rect x="8" y="8" width="224" height="224" rx="28" fill="url(#bgGrad_noun_015)" stroke="#BF360C" stroke-width="2.5" filter="url(#cardShadow_noun_015)"/>

