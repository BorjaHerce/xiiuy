  <!-- Central Distinct Cartoon Artwork -->
  <g id="illustration-art">
    <g id="ladron_art"><circle cx="108" cy="80" r="22" fill="#FFCCBC" stroke="#212121" stroke-width="3"/><path d="M86,75 C86,52 130,52 130,75 Z" fill="#263238" stroke="#212121" stroke-width="2.5"/><path d="M90,78 Q108,82 126,78 Q126,88 108,86 Q90,88 90,78 Z" fill="#212121"/><circle cx="100" cy="82" r="3" fill="#FFFFFF"/><circle cx="116" cy="82" r="3" fill="#FFFFFF"/><path d="M86,162 C86,106 132,106 132,162 Z" fill="#ECEFF1" stroke="#212121" stroke-width="3"/><line x1="88" y1="122" x2="130" y2="122" stroke="#212121" stroke-width="4"/><line x1="87" y1="136" x2="131" y2="136" stroke="#212121" stroke-width="4"/><line x1="86" y1="150" x2="132" y2="150" stroke="#212121" stroke-width="4"/><ellipse cx="152" cy="126" rx="22" ry="26" transform="rotate(-12 152 126)" fill="#D7CCC8" stroke="#4E342E" stroke-width="2.8"/><text x="150" y="134" font-size="20" font-weight="bold" fill="#2E7D32" text-anchor="middle">$</text></g>
