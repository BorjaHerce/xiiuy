      <stop offset="0%" stop-color="#E0F2F1"/>
      <stop offset="100%" stop-color="#B2DFDB"/>
    </linearGradient>
    <filter id="cardShadow_verb_121" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Card Base -->
  <rect x="8" y="8" width="224" height="224" rx="28" fill="url(#bgGrad_verb_121)" stroke="#004D40" stroke-width="2.5" filter="url(#cardShadow_verb_121)"/>

  <!-- Top Category Tag Pill -->
  <g transform="translate(16, 16)">
    <rect x="0" y="0" width="120" height="20" rx="10" fill="#B2DFDB" stroke="#004D40" stroke-width="1.2"/>
    <text x="60" y="13.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="8" font-weight="800" fill="#004D40" text-anchor="middle" letter-spacing="0.3">ACCIONES Y VERBOS</text>
  </g>

  <!-- ID badge on top right -->
  <g transform="translate(162, 16)">
    <rect x="0" y="0" width="62" height="20" rx="10" fill="rgba(255,255,255,0.85)" stroke="#004D40" stroke-width="1.2"/>
    <text x="31" y="13.5" font-family="monospace" font-size="8.5" font-weight="700" fill="#37474F" text-anchor="middle">verb_121</text>
  </g>

