    <text x="106" y="30" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" font-weight="600" fill="#546E7A" text-anchor="middle">tejer</text>
    <text x="106" y="41" font-family="monospace" font-size="8" font-weight="700" fill="#004D40" text-anchor="middle">[ lape ]</text>
