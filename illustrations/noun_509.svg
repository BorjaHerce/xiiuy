    <g id="noun_509_art" transform="translate(1,2) rotate(-0.6 120 115)"><path d="M120,164 L120,118 L92,94 M120,124 L148,94" fill="none" stroke="#5D4037" stroke-width="7" stroke-linecap="round"/><ellipse cx="120" cy="88" rx="54" ry="22" fill="#7CB342" stroke="#33691E" stroke-width="3"/><line x1="96" y1="104" x2="96" y2="122" stroke="#FFA000" stroke-width="4" stroke-linecap="round"/><line x1="142" y1="104" x2="142" y2="122" stroke="#FFA000" stroke-width="4" stroke-linecap="round"/></g>
  </g>

  <!-- Bottom Information Banner -->
  <g transform="translate(14, 180)">
    <rect x="0" y="0" width="212" height="46" rx="20" fill="rgba(255,255,255,0.96)" stroke="#1B5E20" stroke-width="1.5"/>
    <text x="106" y="17" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="800" fill="#212121" text-anchor="middle">mesquite</text>
