  </g>

  <!-- ID badge on top right -->
  <g transform="translate(162, 16)">
    <rect x="0" y="0" width="62" height="20" rx="10" fill="rgba(255,255,255,0.85)" stroke="#4A148C" stroke-width="1.2"/>
    <text x="31" y="13.5" font-family="monospace" font-size="8.5" font-weight="700" fill="#37474F" text-anchor="middle">noun_128</text>
  </g>

  <!-- Procedural Decorative Aura Pattern -->
  <g opacity="0.16"><circle cx="120" cy="115" r="68" fill="none" stroke="#7B1FA2" stroke-width="2" stroke-dasharray="4,6"/><line x1="120" y1="42" x2="120" y2="188" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="3,5"/><line x1="47" y1="115" x2="193" y2="115" stroke="#7B1FA2" stroke-width="1.5" stroke-dasharray="3,5"/></g>

  <!-- Central Distinct Cartoon Artwork -->
  <g id="illustration-art">
    <g id="pantalon_pants"><polygon points="84,56 156,56 164,164 130,164 120,104 110,164 76,164" fill="#1E88E5" stroke="#0D47A1" stroke-width="3" stroke-linejoin="round"/><rect x="84" y="56" width="72" height="12" fill="#1565C0" stroke="#0D47A1" stroke-width="2"/><circle cx="120" cy="62" r="3" fill="#FFD54F"/><path d="M84,78 Q98,84 100,68 M156,78 Q142,84 140,68" fill="none" stroke="#0D47A1" stroke-width="2.2"/><line x1="120" y1="68" x2="120" y2="96" stroke="#0D47A1" stroke-width="2.2"/></g>
  </g>

